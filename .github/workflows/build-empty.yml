name: Check Android build
on:
  push:
    branches: [main]
    paths:
      - android/**
      - .github/workflows/build-empty.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile Release and run checks
        working-directory: android
        run: bash gradlew assembleRelease testDebugUnitTest lintRelease --no-daemon
      - name: Verify unsigned APK contains no bundled timetable
        run: |
          python - <<'PY'
          import zipfile,json
          with zipfile.ZipFile('android/app/build/outputs/apk/release/app-release-unsigned.apk') as z:
              d=json.loads(z.read('assets/school-data.json'))
              assert not d['strings'] and not d['teacherProjects']
              assert all(not c['courses'] for c in d['classes'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: android-unsigned-build-${{ github.sha }}
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
