name: Check encrypted JW session
on:
  pull_request:
    branches: [main]
    paths:
      - android/**
      - .github/workflows/check-jw-session.yml
  push:
    branches: [main]
    paths:
      - android/**
      - .github/workflows/check-jw-session.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  session-security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - name: Verify Keystore encryption, restore, tamper rejection and deletion
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          disable-animations: true
          script: cd android && bash gradlew connectedDebugAndroidTest --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jw-session-test-reports
          path: android/app/build/reports/androidTests/connected/
          if-no-files-found: ignore
