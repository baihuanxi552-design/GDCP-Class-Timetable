name: Publish Android 3.2.2 Release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-android-release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-3.2.2
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout published files
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify APK checksum
        working-directory: downloads
        run: sha256sum --check SHA256SUMS.txt
      - name: Publish signed APK and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: android-v3.2.2
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              downloads/Class-Timetable-3.2.2.apk \
              downloads/SHA256SUMS.txt --clobber
          else
            gh release create "$RELEASE_TAG" \
              downloads/Class-Timetable-3.2.2.apk \
              downloads/SHA256SUMS.txt \
              --target "$GITHUB_SHA" \
              --title "班级课表 · Android 3.2.2" \
              --notes-file downloads/ANDROID-3.2.2-RELEASE.md \
              --draft
          fi
          gh release edit "$RELEASE_TAG" --draft=false --latest
          gh release view "$RELEASE_TAG" --json url,assets
