version: 2
updates:
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    # Individually tested: these exact releases require a coordinated SDK migration.
    ignore:
      - dependency-name: org.jetbrains.compose
        versions: ["1.12.1"]
      - dependency-name: "top.yukonga.miuix.kmp:miuix"
        versions: ["0.8.8"]
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - android
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
